<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerente Comercial AI · Grit Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --surface2: #f5f5f7;
    --border: rgba(0,0,0,0.06);
    --border-s: rgba(0,0,0,0.10);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #aeaeb2;
    --accent: #7c5ce0;
    --accent-l: #ede8fb;
    --green: #30d158;
    --red: #ff453a;
    --amber: #ff9f0a;
    --blue: #0a84ff;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.07), 0 2px 6px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.10), 0 2px 10px rgba(0,0,0,0.04);
    --shadow-bubble: 0 2px 12px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.03);
    --shadow-input: 0 2px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.03);
    --shadow-header: 0 1px 0 rgba(0,0,0,0.04), 0 4px 20px rgba(0,0,0,0.04);
    --r-sm: 12px; --r-md: 18px; --r-lg: 24px; --r-xl: 28px;
    --font: 'Manrope', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  html, body { height:100%; font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; overflow:hidden; }

  .app { display:flex; flex-direction:column; height:100dvh; max-width:820px; margin:0 auto; background:var(--bg); }
  @media(min-width:860px){
    body{display:flex;align-items:center;justify-content:center}
    .app{height:94vh;max-height:920px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 .5px rgba(0,0,0,.06)}
  }

  /* Status */
  .status-bar{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 20px;background:var(--surface);border-bottom:.5px solid var(--border);opacity:0;transform:translateY(-6px);animation:sd .5s cubic-bezier(.34,1.4,.64,1) .1s forwards}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
  .status-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--green);opacity:0;animation:dg 2.5s ease-in-out infinite}
  @keyframes dg{0%,100%{opacity:0;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
  .status-text{font-size:11.5px;font-weight:500;color:var(--text-2)}

  /* Header */
  .header{display:flex;align-items:center;gap:14px;padding:14px 20px 13px;background:var(--surface);box-shadow:var(--shadow-header);position:relative;z-index:2;opacity:0;transform:translateY(-10px);animation:sd .55s cubic-bezier(.34,1.4,.64,1) .18s forwards}
  .header-avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 2px 10px rgba(124,92,224,.18),0 0 0 2px rgba(124,92,224,.1)}
  .header-avatar img{width:100%;height:100%;object-fit:cover}
  .header-info{flex:1;min-width:0}
  .header-name{font-size:16.5px;font-weight:700;color:var(--text);letter-spacing:-.4px;line-height:1.2}
  .header-sub{font-size:12px;font-weight:500;color:var(--text-2);margin-top:2px}
  .header-badge{font-size:11px;font-weight:600;padding:5px 12px;background:var(--surface2);border-radius:20px;color:var(--text-2);white-space:nowrap;flex-shrink:0;box-shadow:var(--shadow-xs)}

  /* Messages */
  .messages{flex:1;overflow-y:auto;padding:20px 20px 8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;opacity:0;animation:fi .4s ease .45s forwards}
  .messages::-webkit-scrollbar{width:0}
  .date-divider{display:flex;align-items:center;gap:14px;margin:6px 0 14px;opacity:0;animation:fi .4s ease .65s forwards}
  .date-divider::before,.date-divider::after{content:'';flex:1;height:.5px;background:var(--border-s)}
  .date-divider span{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}

  .msg-group{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
  .msg-row{display:flex;align-items:flex-end;gap:10px;opacity:0;transform:translateY(10px) scale(.97);animation:bi .4s cubic-bezier(.34,1.4,.64,1) forwards}
  .msg-row.user{flex-direction:row-reverse}
  .msg-avatar-sm{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow-sm)}
  .msg-avatar-sm img{width:100%;height:100%;object-fit:cover}
  .msg-row:not(:last-child) .msg-avatar-sm{opacity:0}

  .bubble{max-width:min(74%,540px);padding:11px 15px;font-size:14.5px;line-height:1.6;word-break:break-word}
  .bubble.ai{background:var(--surface);color:var(--text);border-radius:6px var(--r-md) var(--r-md) 6px;box-shadow:var(--shadow-bubble)}
  .msg-row:first-child .bubble.ai{border-top-left-radius:var(--r-md)}
  .msg-row:last-child .bubble.ai{border-bottom-left-radius:var(--r-md)}
  .bubble.user{background:linear-gradient(135deg,#7c5ce0,#9d7cee);color:#fff;border-radius:var(--r-md) 6px 6px var(--r-md);box-shadow:0 3px 14px rgba(124,92,224,.22)}
  .msg-row:first-child .bubble.user{border-top-right-radius:var(--r-md)}
  .msg-row:last-child .bubble.user{border-bottom-right-radius:var(--r-md)}

  .bubble.ai strong{font-weight:700}
  .bubble.ai em{font-style:italic}
  .bubble.ai ul,.bubble.ai ol{padding-left:18px;margin:6px 0}
  .bubble.ai li{margin-bottom:3px}
  .bubble.ai p+p{margin-top:8px}
  .bubble.ai code{font-family:"SF Mono","Fira Code",monospace;font-size:12.5px;background:var(--surface2);padding:2px 6px;border-radius:5px}
  .bubble.ai hr{border:none;border-top:.5px solid var(--border-s);margin:10px 0}

  .msg-time{font-size:10.5px;font-weight:500;color:var(--text-3);padding:0 4px;align-self:flex-end;margin-bottom:2px;opacity:0;transition:opacity .2s}
  .msg-group:hover .msg-time{opacity:1}

  /* Typing */
  .typing-row{display:flex;align-items:flex-end;gap:10px;opacity:0;transform:translateY(6px);animation:bi .3s cubic-bezier(.34,1.4,.64,1) forwards}
  .typing-bubble{background:var(--surface);border-radius:var(--r-md);padding:13px 18px;display:flex;align-items:center;gap:5px;box-shadow:var(--shadow-bubble)}
  .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:tb 1.3s ease-in-out infinite}
  .typing-dot:nth-child(1){animation-delay:0s}
  .typing-dot:nth-child(2){animation-delay:.18s}
  .typing-dot:nth-child(3){animation-delay:.36s}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

  /* Suggestions */
  .suggestions{padding:0 20px 10px;display:flex;flex-wrap:wrap;gap:8px;opacity:0;animation:fi .4s ease .85s forwards}
  .suggestion-chip{font-family:var(--font);font-size:12.5px;font-weight:500;padding:7px 14px;background:var(--surface);border:.5px solid var(--border-s);border-radius:20px;color:var(--text-2);cursor:pointer;transition:all .2s cubic-bezier(.34,1.4,.64,1);white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow-xs)}
  .suggestion-chip:hover{background:var(--accent-l);color:var(--accent);border-color:rgba(124,92,224,.2);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
  .suggestion-chip:active{transform:scale(.96) translateY(0)}

  /* Input */
  .input-area{padding:10px 16px 14px;background:transparent;opacity:0;transform:translateY(12px);animation:su .5s cubic-bezier(.34,1.4,.64,1) .35s forwards}
  .input-row{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:.5px solid var(--border-s);border-radius:var(--r-xl);padding:8px 8px 8px 18px;transition:border-color .25s,box-shadow .25s;box-shadow:var(--shadow-input)}
  .input-row:focus-within{border-color:rgba(124,92,224,.35);box-shadow:var(--shadow-input),0 0 0 3px rgba(124,92,224,.08)}
  textarea{flex:1;font-family:var(--font);font-size:15px;font-weight:400;color:var(--text);background:transparent;border:none;outline:none;resize:none;line-height:1.5;max-height:120px;min-height:22px;overflow-y:auto;padding:2px 0}
  textarea::placeholder{color:var(--text-3)}
  textarea::-webkit-scrollbar{width:0}
  .send-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s cubic-bezier(.34,1.4,.64,1);-webkit-tap-highlight-color:transparent;box-shadow:0 2px 10px rgba(124,92,224,.25)}
  .send-btn:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(124,92,224,.35)}
  .send-btn:active{transform:scale(.92)}
  .send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
  .send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .input-area{padding-bottom:max(14px,env(safe-area-inset-bottom))}

  /* ── DASHBOARD ── */
  .dashboard{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-md);overflow:hidden;margin:4px 0;max-width:min(90%,580px)}
  .dash-header{padding:14px 16px 10px;border-bottom:.5px solid var(--border)}
  .dash-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.2px}
  .dash-subtitle{font-size:11.5px;font-weight:500;color:var(--text-2);margin-top:2px}
  .dash-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border);border-bottom:.5px solid var(--border)}
  .dash-metric{background:var(--surface);padding:14px 14px 12px;text-align:center}
  .dash-metric-value{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  .dash-metric-label{font-size:10.5px;font-weight:600;color:var(--text-2);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
  .dash-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .dash-table th{text-align:left;padding:9px 14px;font-weight:600;color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:.5px solid var(--border)}
  .dash-table td{padding:10px 14px;border-bottom:.5px solid var(--border);color:var(--text)}
  .dash-table tr:last-child td{border-bottom:none}
  .dash-table tr:hover td{background:var(--surface2)}
  .dash-bar-wrap{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:60px}
  .dash-bar{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.34,1.4,.64,1)}
  .dash-pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px}
  .pill-green{background:#e8faf0;color:#1a8d4f}
  .pill-red{background:#fde8e8;color:#c53030}
  .pill-amber{background:#fef3e2;color:#b45309}
  .pill-blue{background:#e8f0fb;color:#1a56c4}
  .pill-purple{background:#ede8fb;color:#6b3fc4}
  .dash-footer{padding:10px 14px;text-align:center;font-size:10.5px;color:var(--text-3);font-weight:500}

  /* Keyframes */
  @keyframes sd{to{opacity:1;transform:translateY(0)}}
  @keyframes su{to{opacity:1;transform:translateY(0)}}
  @keyframes fi{to{opacity:1}}
  @keyframes bi{to{opacity:1;transform:translateY(0) scale(1)}}

  /* Mobile */
  @media(max-width:480px){
    .header{padding:11px 16px 10px;gap:12px}
    .header-avatar{width:40px;height:40px}
    .header-name{font-size:15px}
    .header-badge{display:none}
    .messages{padding:16px 14px 6px}
    .suggestions{padding:0 14px 8px}
    .input-area{padding:8px 10px 14px}
    .bubble{font-size:14px;max-width:82%}
    .input-row{padding:6px 6px 6px 14px}
    .dashboard{max-width:95%}
    .dash-metrics{grid-template-columns:repeat(2,1fr)}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

// ── Format markdown ──
function fmt(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .replace(/^### (.*$)/gm,'<strong>$1</strong>')
    .replace(/^## (.*$)/gm,'<strong>$1</strong>')
    .replace(/^# (.*$)/gm,'<strong>$1</strong>')
    .replace(/^- (.*$)/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>(\s*<li>[\s\S]*?<\/li>)*)/g,'<ul>$1</ul>')
    .replace(/---/g,'<hr>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}

// ── Dashboard renderer ──
function renderDashboard(data){
  let h='<div class="dashboard">';
  // Header
  h+='<div class="dash-header"><div class="dash-title">'+(data.title||'Dashboard')+'</div>';
  if(data.subtitle) h+='<div class="dash-subtitle">'+data.subtitle+'</div>';
  h+='</div>';
  // Metrics
  if(data.metrics&&data.metrics.length){
    h+='<div class="dash-metrics">';
    const colors=['var(--accent)','var(--blue)','var(--green)','var(--amber)','var(--red)'];
    data.metrics.forEach((m,i)=>{
      h+='<div class="dash-metric"><div class="dash-metric-value" style="color:'+colors[i%colors.length]+'">'+m.value+'</div><div class="dash-metric-label">'+m.label+'</div></div>';
    });
    h+='</div>';
  }
  // Table
  if(data.table){
    h+='<table class="dash-table"><thead><tr>';
    data.table.headers.forEach(th=>{h+='<th>'+th+'</th>'});
    h+='</tr></thead><tbody>';
    const maxVal=data.table.barColumn!==undefined?Math.max(...data.table.rows.map(r=>parseFloat(r[data.table.barColumn])||0)):0;
    data.table.rows.forEach(row=>{
      h+='<tr>';
      row.forEach((cell,ci)=>{
        if(ci===data.table.pillColumn){
          const pillClass=data.table.pillMap&&data.table.pillMap[cell]?'pill-'+data.table.pillMap[cell]:'pill-blue';
          h+='<td><span class="dash-pill '+pillClass+'">'+cell+'</span></td>';
        } else if(ci===data.table.barColumn){
          const pct=maxVal?(parseFloat(cell)/maxVal*100):0;
          const barColor=pct>66?'var(--green)':pct>33?'var(--amber)':'var(--red)';
          h+='<td><div style="display:flex;align-items:center;gap:8px"><span>'+cell+'</span><div class="dash-bar-wrap"><div class="dash-bar" style="width:'+pct+'%;background:'+barColor+'"></div></div></div></td>';
        } else {
          h+='<td>'+cell+'</td>';
        }
      });
      h+='</tr>';
    });
    h+='</tbody></table>';
  }
  // Footer
  h+='<div class="dash-footer">Generado por Gerente Comercial AI · '+new Date().toLocaleDateString('es-PE')+'</div>';
  h+='</div>';
  return h;
}

// ── Parse response: text + dashboard blocks ──
function parseResponse(text){
  const dashRegex=/\[DASHBOARD:([\s\S]*?)\]/g;
  let parts=[];
  let lastIdx=0;
  let match;
  while((match=dashRegex.exec(text))!==null){
    const before=text.slice(lastIdx,match.index).trim();
    if(before) parts.push({type:'text',content:before});
    try{
      const d=JSON.parse(match[1]);
      parts.push({type:'dashboard',content:d});
    }catch(e){parts.push({type:'text',content:match[0]})}
    lastIdx=match.index+match[0].length;
  }
  const after=text.slice(lastIdx).trim();
  if(after) parts.push({type:'text',content:after});
  if(!parts.length) parts.push({type:'text',content:text});
  return parts;
}

function renderResponse(text){
  const parts=parseResponse(text);
  const g=mk('div','msg-group');
  parts.forEach(p=>{
    const r=mk('div','msg-row');r.style.animationDelay='0ms';
    const av=mk('div','msg-avatar-sm');av.innerHTML='<img src="'+LOGO+'" alt="AI">';
    r.append(av);
    if(p.type==='dashboard'){
      const d=document.createElement('div');
      d.innerHTML=renderDashboard(p.content);
      r.append(d.firstChild);
    } else {
      const b=mk('div','bubble ai');b.innerHTML=fmt(p.content);
      r.append(b);
    }
    g.append(r);
  });
  const lastRow=g.lastElementChild;
  if(lastRow){const t=mk('div','msg-time');t.textContent=now();lastRow.append(t)}
  msgs.append(g);scroll();
}

    setStatus(true);
    const res=await fetch(N8N_WEBHOOK_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chatInput:text,sessionId:SID,action:'sendMessage'})
    });
    hideTyping();
    if(!res.ok)throw new Error('HTTP '+res.status);
    const ct=res.headers.get('content-type')||'';

    // Lee la respuesta completa como texto primero (más seguro con n8n)
    const rawText = await res.text();

    let reply = '';

    if(rawText.includes('"type":"item"') || rawText.includes('"type": "item"')){
      // Formato n8n streaming — cada línea es un JSON con type:item/begin/end
      for(const line of rawText.split('\n')){
        const t=line.trim();
        if(!t)continue;
        try{
          const p=JSON.parse(t);
          if(p.type==='item' && typeof p.content==='string') reply+=p.content;
        }catch{}
      }
    } else if(ct.includes('text/event-stream') || rawText.includes('data: ')){
      // Formato SSE estándar
      for(const line of rawText.split('\n')){
        if(line.startsWith('data: ')){
          const d=line.slice(6).trim();
          if(d===''||d==='[DONE]')continue;
          try{
            const p=JSON.parse(d);
            if(p.type&&['begin','end','error','ping','agentReasoning'].includes(p.type))continue;
            reply+=p.choices?.[0]?.delta?.content||p.choices?.[0]?.message?.content||p.text||p.output||p.message||'';
          }catch{ reply+=d; }
        }
      }
    } else if(ct.includes('application/json') || rawText.trim().startsWith('{')){
      // Formato JSON simple
      try{
        const data=JSON.parse(rawText);
        reply=data.output||data.text||data.message||data.response||data.reply||(data.data&&(data.data.output||data.data.text))||'';
      }catch{
        reply=rawText;
      }
    } else {
      // Texto plano
      reply=rawText;
    }

    reply=reply.trim();
    if(!reply) reply='Recibí una respuesta vacía. Intenta de nuevo.';
    renderResponse(reply);
    setStatus(true);
  }catch(err){
    hideTyping();setStatus(false);
    addAI('No pude conectar con el servidor. Verifica que el flujo de n8n esté activo e intenta de nuevo.');
    console.error(err);
  }
  busy=false;btn.disabled=!inp.value.trim();inp.focus();scroll();
}
</script>
